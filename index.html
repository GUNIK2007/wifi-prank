<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DIRECTION-DRSI – Portail de connexion</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-orb orb-1" aria-hidden="true"></div>
  <div class="bg-orb orb-2" aria-hidden="true"></div>

  <main class="card" id="card">

    <!-- Écran 1 : portail -->
    <section class="screen active" id="screen-login">
      <div class="wifi-icon" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="72" height="72" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round">
          <path d="M6 24c14-13 38-13 52 0"/>
          <path d="M15 34c9-8 25-8 34 0"/>
          <path d="M24 44c5-4 11-4 16 0"/>
          <circle cx="32" cy="53" r="2.5" fill="currentColor" stroke="none"/>
        </svg>
      </div>
      <h1>DIRECTION-DRSI</h1>
      <p class="subtitle">Réseau ouvert · Accès gratuit</p>
      <p class="info">Appuie sur le bouton pour accéder à Internet.</p>
      <button class="btn" id="btn-connect" type="button">Se connecter</button>
    </section>

    <!-- Écran 2 : chargement -->
    <section class="screen" id="screen-loading">
      <div class="spinner" aria-hidden="true"></div>
      <h2 id="loading-title">Connexion en cours…</h2>
      <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      <p class="info" id="loading-text">Recherche du réseau…</p>
    </section>

    <!-- Écran 3 : la blague -->
    <section class="screen" id="screen-reveal">
      <div class="emoji-big" aria-hidden="true">😂</div>
      <h2>C'EST LE WIFI DE TA MÈRE !</h2>
      <p class="reveal-text">TRUUUUUUUUUUUUU !!!!!!!!<br>DEHORS .</p>
      <button class="btn btn-secondary" id="btn-restart" type="button">Recommencer</button>
    </section>

  </main>

  <div class="confetti-layer" id="confetti" aria-hidden="true"></div>

  <script src="script.js"></script>
</body>
</html>
